name: event-probe
run-name: "${{ github.event_name }} ${{ github.event.action }} #${{ github.event.issue.number || github.event.pull_request.number }} changes=${{ join(github.event.changes.*.from, '|') != '' }}"
on:
  issues:
    types: [opened, edited, deleted, transferred, pinned, unpinned, closed, reopened, assigned, unassigned, labeled, unlabeled, locked, unlocked, milestoned, demilestoned, typed, untyped]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, closed, reopened, synchronize, converted_to_draft, ready_for_review, locked, unlocked, review_requested, review_request_removed, auto_merge_enabled, auto_merge_disabled, milestoned, demilestoned, enqueued, dequeued]
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo "noop"